name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build main package (unctools)
      run: python -m build --outdir dist/main/

    - name: Build alias package (dazzle-unctools)
      run: python -m build packages/dazzle-unctools-alias/ --outdir dist/alias/

    - name: Check packages with twine
      run: |
        twine check dist/main/*
        twine check dist/alias/*

    - name: Upload main artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-main
        path: dist/main/

    - name: Upload alias artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-alias
        path: dist/alias/

  test-install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.13']

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-main
        path: dist/

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test installation
      shell: bash
      run: |
        pip install dist/*.whl
        python -c "import unctools; print(f'UNCtools {unctools.__version__} installed successfully')"

  publish-test-pypi:
    needs: test-install
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true'
    environment: testpypi

    steps:
    - name: Download main artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-main
        path: dist/

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: true
        verbose: true

  publish-main:
    name: Publish unctools
    needs: test-install
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'false')
    environment:
      name: pypi
      url: https://pypi.org/p/unctools

    permissions:
      id-token: write

    steps:
    - name: Download main artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-main
        path: dist/

    - name: Publish to PyPI (trusted publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        verbose: true

  publish-alias:
    name: Publish dazzle-unctools
    needs: test-install
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'false')
    environment:
      name: pypi
      url: https://pypi.org/p/dazzle-unctools

    permissions:
      id-token: write

    steps:
    - name: Download alias artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-alias
        path: dist/

    - name: Publish to PyPI (trusted publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        verbose: true
